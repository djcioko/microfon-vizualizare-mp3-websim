<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Song Visualizer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="ui">
    <div class="controls">
      <label class="button">+ Add Clip
        <input id="file-input" type="file" accept="audio/*,video/*" multiple hidden>
      </label>
      <button id="prev">Prev</button>
      <button id="playpause">Play</button>
      <button id="stop">Stop</button>
      <button id="next">Next</button>
      <button id="record">Record</button>
      <button id="export">Export Video</button>

      <select id="audio-device" title="Microfon">
        <option value="">🎤 Default Mic</option>
      </select>
      <button id="mic-listen">🎤 Listen Mic</button>

      <select id="mode">
        <option value="bars">Bars</option>
        <option value="radial">Radial</option>
        <option value="wave">Waveform</option>
        <option value="particles">Particles</option>
      </select>
      <label class="inline">Intensity
        <input id="intensity" type="range" min="0.5" max="3" step="0.1" value="1.5">
      </label>
      <label class="inline">Color
        <input id="viz-color" type="color" value="#ffffff">
      </label>
    </div>
    <div id="current-track-display">Sursă: Nicio piesă</div>
    <ul id="clip-list"></ul>
  </div>

  <div id="dock">
    <button id="toggle-ui">✕ Ascunde comenzi</button>
    <button id="fullscreen-btn">⛶ Fullscreen</button>
  </div>

  <div id="status-toast"></div>
  <canvas id="canvas"></canvas>

  <audio id="hidden-audio" crossorigin="anonymous"></audio>
  <script src="./app.js"></script>
</body>
</html>
